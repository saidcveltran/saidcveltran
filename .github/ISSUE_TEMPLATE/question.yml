name: Ask a question
description: A question about a project or about working together.
title: "Question: "
labels: ["question"]
body:
  - type: input
    id: project
    attributes:
      label: Project
      description: Which repository is this about? Leave it empty for a general question.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
